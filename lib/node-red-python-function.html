<script type="text/javascript">
    (function () {
        // The three code tabs, laid out as the JavaScript Function node lays out its own:
        // On Start, On Message, On Stop.
        var EDITORS = [
            {tab: 'func-tab-init', field: 'initialize', editor: 'initEditor', label: 'On Start'},
            {tab: 'func-tab-body', field: 'func', editor: 'editor', label: 'On Message'},
            {tab: 'func-tab-finalize', field: 'finalize', editor: 'finalizeEditor', label: 'On Stop'}
        ];

        RED.nodes.registerType('node-red-python-function', {
            category: 'function',
            color: '#fdd0a2',
            defaults: {
                name: {value: ""},
                func: {value: "\nreturn msg"},
                outputs: {value: 1},  // Ofuscated way to persist the number of outputs of the node
                timeout: {value: 0},
                initialize: {value: ""},
                finalize: {value: ""}
            },
            inputs: 1,
            outputs: 1,
            icon: "function.png",
            // The type is the package name so it is unmistakably unique and so an "unknown node type"
            // message names the thing to install. Neither of those is a reason to show it on the
            // canvas, hence an explicit short label for both the palette and unnamed nodes.
            paletteLabel: "python function",
            label: function() {
                return this.name || "python function";
            },
            oneditprepare: function() {
                var that = this;
                var tabs = RED.tabs.create({
                    id: "func-tabs",
                    onchange: function(tab) {
                        $("#func-tabs-content").children().hide();
                        $("#" + tab.id).show();
                        RED.tray.resize();
                    }
                });
                tabs.addTab({id: "func-tab-config", iconClass: "fa fa-cog", label: "Setup"});
                EDITORS.forEach(function (e) {
                    tabs.addTab({id: e.tab, label: e.label});
                });
                tabs.activateTab("func-tab-body");

                $("#node-input-outputs").spinner({min: 1});
                // Seconds; 0 is no timeout, as in the JavaScript node.
                $("#node-input-timeout").spinner({min: 0});

                // Ask Node-RED for an editor instead of calling the `ace` global. Upstream did
                // `ace.edit(...)` directly, which only worked because Node-RED used to load ACE on
                // every page. Node-RED 5 loads just the library settings.js selects — Monaco by
                // default — so there `ace` is undefined, oneditprepare threw, and the dialog opened
                // with an empty box where the code should be. createEditor returns whichever editor
                // the runtime has (Monaco, ACE or the basic textarea) behind one interface, and it
                // has been there since Node-RED 0.x. Node-RED maps 'ace/mode/python' to Monaco's
                // Python itself.
                EDITORS.forEach(function (e) {
                    that[e.editor] = RED.editor.createEditor({
                        id: 'node-input-' + e.field + '-editor',
                        mode: 'ace/mode/python',
                        value: $("#node-input-" + e.field).val(),
                        focus: e.field === 'func'
                    });
                });
                // ACE only: offer the Node-RED names as completions. Monaco has no `completers`
                // and its word-based suggestions cover the same ground.
                var noderedKeywords = [
                    'msg', "msg['payload']", 'node', 'node.send', 'node.log', 'node.warn',
                    'node.error', 'node.status', 'node.id', 'node.name', 'node.path',
                    'node.outputCount', 'env.get', 'flow.get', 'flow.set', 'global_ctx.get',
                    'global_ctx.set'
                ];
                EDITORS.forEach(function (e) {
                    if (that[e.editor].completers) {
                        that[e.editor].completers.push({
                            getCompletions: function (state, session, pos, prefix, callback) {
                                callback(null, noderedKeywords.map(function (word) {
                                    return {name: word, value: word, score: 0, meta: 'Node-RED'};
                                }));
                            }
                        });
                    }
                });
            },
            oneditsave: function() {
                var that = this;
                var noerr = 0;
                EDITORS.forEach(function (e) {
                    var editor = that[e.editor];
                    var annot = editor.getSession().getAnnotations();
                    for (var k = 0; k < annot.length; k++) {
                        if (annot[k].type === "error") {
                            noerr += 1;
                        }
                    }
                    $("#node-input-" + e.field).val(editor.getValue());
                    editor.destroy();
                    delete that[e.editor];
                });
                $("#node-input-noerr").val(noerr);
                this.noerr = noerr;
            },
            oneditcancel: function() {
                var that = this;
                EDITORS.forEach(function (e) {
                    that[e.editor].destroy();
                    delete that[e.editor];
                });
            },
            oneditresize: function(size) {
                var that = this;
                EDITORS.forEach(function (e) {
                    $("#node-input-" + e.field + "-editor").css("height", (size.height - 83) + "px");
                    that[e.editor].resize();
                });
            }
        });
    })();
</script>

<script type="text/x-red" data-template-name="node-red-python-function">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span>Name</span></label>
        <input type="text" id="node-input-name" placeholder="Name">
        <input type="hidden" id="node-input-func">
        <input type="hidden" id="node-input-initialize">
        <input type="hidden" id="node-input-finalize">
        <input type="hidden" id="node-input-noerr">
    </div>
    <div class="form-row" style="margin-bottom: 0;">
        <ul style="min-width: 600px; margin-bottom: 20px;" id="func-tabs"></ul>
    </div>
    <div id="func-tabs-content" style="min-height: calc(100% - 95px);">
        <div id="func-tab-config" style="display:none">
            <div class="form-row" style="display: inline-block; margin-right: 50px;">
                <label for="node-input-outputs"><i class="fa fa-random"></i> <span>Outputs</span></label>
                <input id="node-input-outputs" style="width: 60px;" value="1">
            </div>
            <div class="form-row" style="display: inline-block;">
                <label for="node-input-timeout"><i class="fa fa-clock-o"></i> <span>Timeout</span></label>
                <input id="node-input-timeout" style="width: 60px;" placeholder="seconds">
            </div>
        </div>
        <div id="func-tab-init" style="display:none">
            <div class="form-row node-text-editor-row">
                <div style="height: 250px; min-height:150px;" class="node-text-editor" id="node-input-initialize-editor"></div>
            </div>
        </div>
        <div id="func-tab-body" style="display:none">
            <div class="form-row node-text-editor-row">
                <div style="height: 220px; min-height:150px;" class="node-text-editor" id="node-input-func-editor"></div>
            </div>
        </div>
        <div id="func-tab-finalize" style="display:none">
            <div class="form-row node-text-editor-row">
                <div style="height: 250px; min-height:150px;" class="node-text-editor" id="node-input-finalize-editor"></div>
            </div>
        </div>
    </div>
</script>

<script type="text/x-red" data-help-name="node-red-python-function">
    <p>A Function node, in Python. It behaves like the built-in JavaScript Function node:
       the same tabs, the same way of sending messages, and errors reach a Catch node the same way.</p>

    <h3>Tabs</h3>
    <dl class="message-properties">
        <dt>Setup</dt>
        <dd>The number of outputs, and a timeout in seconds (0 for none). A message that runs
            longer fails with <code>Script execution timed out after …ms</code>; the messages
            behind it carry on.</dd>
        <dt>On Start</dt>
        <dd>Runs once, before the first message. Imports and variables made here are there for
            On Message — this is where <code>import</code>s go.</dd>
        <dt>On Message</dt>
        <dd>Runs for each message, which is a dictionary called <code>msg</code>, with the
            body in <code>msg['payload']</code>.</dd>
        <dt>On Stop</dt>
        <dd>Runs when the node stops or is redeployed.</dd>
    </dl>

    <h3>Sending messages</h3>
    <p>Return the messages to pass on, or call <code>node.send(messages)</code>. Either can be:</p>
    <ul>
        <li>a message dictionary — sent to the first output</li>
        <li>a list of them — one for each output, in order</li>
    </ul>
    <p>If an element of the list is itself a list, all of its messages go to that output.
       <code>None</code>, alone or in the list, sends nothing there.</p>
    <p>Messages travel to and from Python as JSON. A Buffer arrives as <code>bytes</code>;
       on the way out, <code>bytes</code> become a Buffer, a <code>datetime</code>,
       <code>date</code> or <code>time</code> its ISO 8601 string, a <code>set</code> a list
       and a <code>Decimal</code> a number. Anything else JSON cannot hold is an error.
       The live <code>msg['req']</code> and <code>msg['res']</code> of an http in node are put
       back on the way out.</p>

    <h3>What the code can use</h3>
    <ul>
        <li><code>node.log(…)</code>, <code>node.warn(…)</code>, <code>node.error(…)</code>,
            <code>node.status({...})</code>, <code>node.send(…)</code></li>
        <li><code>node.id</code>, <code>node.name</code>, <code>node.path</code>,
            <code>node.outputCount</code></li>
        <li><code>flow.get(key)</code> / <code>flow.set(key, value)</code>, and the same on
            <code>global_ctx</code> (<code>global</code> is a reserved word in Python)</li>
        <li><code>env.get(name)</code> — environment variables, as in the JavaScript node</li>
    </ul>

    <h3>Errors</h3>
    <p>An exception the code does not catch is reported as one line in the debug sidebar —
       the exception and the line it happened on, such as <code>KeyError: 'nope' (line 2)</code>
       — and reaches a Catch node, with the traceback in <code>msg.error.stack</code>. The whole
       traceback is also in the Node-RED log.</p>
    <p><code>node.error("text")</code> only reaches the sidebar; <code>node.error("text", msg)</code>
       reaches a Catch node too.</p>
    <p>A Complete node fires for every message once the code has returned.</p>
    <p>If the Python process itself dies, the message it was on fails and the process is
       restarted. Code that cannot load stops the node until it is fixed and deployed again.</p>

    <p>See the <a target="_new" href="https://nodered.org/docs/user-guide/writing-functions">Node-RED documentation</a>
       on writing functions.</p>
</script>
